<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Priority To-Do List</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Page background */
    body {
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    /* Board container */
    .board {
      background-color: #ffffff;
      width: 500px;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
    }

    .board .input-group {
      margin-bottom: 20px;
    }

    /* Task list styling */
    .task-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    /* Individual task styling */
    .task {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #e9ecef;
      padding: 12px 16px;
      margin-bottom: 10px;
      border-radius: 10px;
      cursor: grab;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.5s ease;
    }

    /* Left-side container for checkbox + text */
    .task-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-grow: 1;
    }

    /* Task text */
    .task-left span {
      flex-grow: 1;
    }

    /* Style checkbox */
    .task-left input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #0d6efd; /* Bootstrap primary blue */
    }

    /* Delete button styling */
    .task button {
      font-weight: bold;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Hover float effect */
    .task:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
    }

    .dragging {
      opacity: 0.5;
    }

    /* Slide-in animation for new tasks */
    @keyframes slideIn {
      0% {
        transform: translateY(-20px);
        opacity: 0;
      }
      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .task.added {
      animation: slideIn 0.3s ease forwards;
    }
  </style>
</head>
<body>
  <div class="board">
    <div class="input-group">
      <input type="text" class="form-control" id="taskInput" placeholder="What would you like to accomplish today.">
      <button class="btn btn-primary" id="addTaskBtn">Add</button>
    </div>

    <ul class="task-list" id="taskList">
      <!-- Tasks will appear here -->
    </ul>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script src="script.js"></script>
</body>
</html>
