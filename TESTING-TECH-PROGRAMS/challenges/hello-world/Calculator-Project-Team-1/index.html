<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #1C1C1E;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      color: white;
    }

    
    #screen {
      background: #1C1C1E;
      color: white;
      font-size: 3rem;
      padding: 20px;
      text-align: right;
      border-radius: 10px;
      border: 1px solid #333;
      margin-bottom: 15px;

      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .btn-key {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 70px;
      font-size: 1.8rem;
      border-radius: 10px;
      margin: 5px;
      cursor: pointer;
      user-select: none;
    }

    .key-number {
      background: #505050;
      color: white;
    }
    .key-number:hover {
      background: #6c6c6c;
    }

    .key-operator {
      background: #FF9500;
      color: white;
    }
    .key-operator:hover {
      background: #ffaa2f;
    }

    .key-special {
      background: #D4D4D2;
      color: black;
    }
    .key-special:hover {
      background: #e0e0df;
    }
  </style>
</head>

<body>
  <div class="container my-5" style="max-width: 400px;">
    <div id="screen">0</div>

    <!-- Row 1 -->
    <div class="row g-2">
      <div class="col-4"><div id="C" class="btn-key key-special">C</div></div>
      <div class="col-4"><div id="+/-" class="btn-key key-special">±</div></div>
      <div class="col-4"><div id="%" class="btn-key key-special">%</div></div>
    </div>

    <!-- Row 2 -->
    <div class="row g-2">
      <div class="col-3"><div id="7" class="btn-key key-number">7</div></div>
      <div class="col-3"><div id="8" class="btn-key key-number">8</div></div>
      <div class="col-3"><div id="9" class="btn-key key-number">9</div></div>
      <div class="col-3"><div id="/" class="btn-key key-operator">÷</div></div>
    </div>

    <!-- Row 3 -->
    <div class="row g-2">
      <div class="col-3"><div id="4" class="btn-key key-number">4</div></div>
      <div class="col-3"><div id="5" class="btn-key key-number">5</div></div>
      <div class="col-3"><div id="6" class="btn-key key-number">6</div></div>
      <div class="col-3"><div id="*" class="btn-key key-operator">×</div></div>
    </div>

    <!-- Row 4 -->
    <div class="row g-2">
      <div class="col-3"><div id="1" class="btn-key key-number">1</div></div>
      <div class="col-3"><div id="2" class="btn-key key-number">2</div></div>
      <div class="col-3"><div id="3" class="btn-key key-number">3</div></div>
      <div class="col-3"><div id="-" class="btn-key key-operator">−</div></div>
    </div>

    <!-- Row 5 -->
    <div class="row g-2">
      <div class="col-6"><div id="0" class="btn-key key-number">0</div></div>
      <div class="col-3"><div id="." class="btn-key key-number">.</div></div>
      <div class="col-3"><div id="+" class="btn-key key-operator">+</div></div>
    </div>

    <!-- Row 6 -->
    <div class="row g-2">
      <div class="col-12"><div id="=" class="btn-key key-operator">=</div></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./main.js"></script>
</body>
</html>
